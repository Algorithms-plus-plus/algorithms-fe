<div>
    <h1>Modulo</h1>
</div>
<ul class="nav nav-tabs">
  <li class="nav-item">
    <a class="nav-link" aria-current="page" (click)="activeTab = 'task1'" [class.active] = "activeTab == 'task1'">Task 1</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" aria-current="page" (click)="activeTab = 'task2'" [class.active] = "activeTab == 'task2'">Task 2</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" aria-current="page" (click)="activeTab = 'task3'" [class.active] = "activeTab == 'task3'">Task 3</a>
  </li>
</ul>
<div class="tab-content">
    @switch (activeTab) {
        @case ('task1') {
            <div>
                <h2>Task 1</h2>
                <p>Find</p>
            </div>
            <form [formGroup]="moduloGroup" (ngSubmit)="calculateModulo()">
                <div class="row justify-content-around">
                    <div class="col-5" class="form-group">
                        <label for="dividend">Dividend</label>
                        <input type="number" class="form-control" id="dividend" aria-describedby="dividend" placeholder="Enter dividend" formControlName="dividend">
                        <small id="dividend" class="form-text text-muted">Example: 5</small>
                    </div>
                    <div class="col-5" class="form-group">
                        <label for="divisor">Divisor</label>
                        <input type="number" class="form-control" id="divisor" aria-describedby="divisor" placeholder="Enter divisor" formControlName="divisor">
                        <small id="divisor" class="form-text text-muted">Example: 3</small>
                    </div>
                </div>
                <button type="submit" [disabled]="!moduloGroup.valid" class="btn" 
                    [ngClass]="moduloGroup.valid ? 'btn-primary' : 'btn-secondary'" >Calculate</button>
            </form>
            <div class="mt-3">
            <h3>Result</h3>
            <ng-container>
                    <div>
                        @if (reminder() !== undefined) {
                            <p><strong>Reminder:</strong> {{ reminder() }}</p>
                        }
                        @if (quotient() !== undefined) {
                            <p><strong>Quotient:</strong> {{ quotient() }}</p>
                        }
                    </div>
                </ng-container>
            </div>
        } 
        <!-- @case ('task2') {
            <div>

            </div>
            <div class="mt-3">
                <h3>Result</h3>
                <div>
                    <p>B is also superset of A. A ∩ B = A ⟺ A ⊆ B. So either B=A or A⊊B (proper subset). If A=∅, this holds for any B.</p>

            </div>

                        <small id="setAHelp" class="form-text text-muted">Example: 1,2,4,5,7</small>
                    </div>

                        <small id="setBHelp" class="form-text text-muted">Example: 2,3,4,5,6</small>

        @default {
            <h2>Not implemented</h2>

</div>
